name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Roster is valid JSON
        run: python -c "import json; json.load(open('roster.json'))"
      - name: Installer is valid bash
        run: bash -n install.sh
      - name: fleet runs without a backend installed
        run: |
          python bin/fleet --version
          FLEET_ROSTER=roster.json python bin/fleet route --all
          FLEET_ROSTER=roster.json python bin/fleet models
